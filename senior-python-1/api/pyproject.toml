[project]
name = "senior-python-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.14",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "uvicorn[standard]==0.34.3",
]

[dependency-groups]
dev = [
  "mypy==1.16.1",
  "ruff==0.12.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
