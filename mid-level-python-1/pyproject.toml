[project]
name = "mid-level-python"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.14",
  "pydantic==2.11.7",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.34.3",
]

[dependency-groups]
dev = [
  "mypy==1.16.1",
  "ruff==0.12.1",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
